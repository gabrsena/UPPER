    <!-- Preloads & Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        :root { font-size: 16px; }
        body { 
            font-family: 'Sora', sans-serif; 
            background-color: #09090b;
            color: #a1a1aa;
            overflow-x: hidden;
            line-height: 1.5;
        }
        html { scrollbar-width: none; -ms-overflow-style: none; }
        ::-webkit-scrollbar { display: none; }

        .bg-grid-subtle {
            background-image: radial-gradient(circle at 2px 2px, rgba(255, 255, 255, 0.03) 1px, transparent 0);
            background-size: 40px 40px;
        }

        .hero-gradient {
            background: radial-gradient(circle at top center, rgba(16, 185, 129, 0.1) 0%, transparent 70%);
        }

        @keyframes shimmer-text {
            to { background-position: 200% center; }
        }

        @keyframes fade-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade-in { animation: fade-in 1s ease-out forwards; }
        .animate-shimmer-text { animation: shimmer-text 3s linear infinite; }

        .btn-shimmer {
            position: relative;
            overflow: hidden;
        }

        .btn-shimmer::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            animation: shimmer-btn 3s infinite;
        }

        @keyframes shimmer-btn {
            0% { transform: translateX(-150%) skewX(-20deg); }
            100% { transform: translateX(150%) skewX(-20deg); }
        }

        .animate-glow { animation: pulse-glow 3s ease-in-out infinite; }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(16, 185, 129, 0.2); }
            50% { box-shadow: 0 0 40px rgba(16, 185, 129, 0.5); }
        }
    </style>

    <script type="importmap">
